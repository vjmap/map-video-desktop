<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
<title>连不上站点</title>
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: #0b1020; color: #e8ecf6; font: 14px/1.7 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .box { max-width: 520px; padding: 24px; text-align: center; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: #8e9ab8; margin: 6px 0; overflow-wrap: anywhere; }
  button { margin-top: 16px; background: #3d7bff; color: #fff; border: 0; border-radius: 6px; padding: 8px 20px; font: inherit; cursor: pointer; }
</style>
</head>
<body>
<div class="box">
  <h1>连不上站点</h1>
  <p id="reason"></p>
  <p id="url"></p>
  <p>检查网络，或在菜单「文件 → 设置」里确认站点地址。</p>
  <button id="retry">重试</button>
</div>
<script src="offline.js"></script>
</body>
</html>
