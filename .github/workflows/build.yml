# 打 Windows / macOS（Apple 芯片、Intel）安装包。推到 main 或手动跑：只出产物（在那次运行的 Artifacts 里）；推 v 开头的标签（如 v1.0.0）：再建 Release 草稿。
# 没配证书就出未签名包：Windows 不签，macOS 用 ad-hoc 签名（用户第一次打开按「安装说明.md」放行）。
# 以后有证书了，在仓库 Settings → Secrets 里加上，不用改这个文件：
#   Windows：WIN_CSC_LINK（证书 .pfx 的 base64）、WIN_CSC_KEY_PASSWORD
#   macOS：MAC_CSC_LINK、MAC_CSC_KEY_PASSWORD（Developer ID Application 证书）、APPLE_ID、APPLE_APP_SPECIFIC_PASSWORD、APPLE_TEAM_ID（公证）
# 出错时把日志末尾写成注解：公开仓库的日志要登录才能看，注解不登录也能从 API 读到（check-runs/<job id>/annotations）。
name: 打包桌面端

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["README.md", "安装说明.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: win-x64, builder: "--win --x64" }
          - { os: macos-15, target: mac-arm64, builder: "--mac --arm64" }
          - { os: macos-15-intel, target: mac-x64, builder: "--mac --x64" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 装依赖
        run: npm ci 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: 编 LGPL 版 ffmpeg 要的工具（macOS）
        if: runner.os == 'macOS'
        run: brew install nasm pkgconf autoconf automake libtool meson ninja 2>&1 | tee -a "$RUNNER_TEMP/build.log" || true

      - name: 缓存 macOS 版 ffmpeg
        if: runner.os == 'macOS'
        uses: actions/cache@v6
        with:
          path: staging/ffmpeg-${{ matrix.target }}
          key: ffmpeg-${{ matrix.target }}-${{ hashFiles('binaries.json', 'scripts/build-ffmpeg-macos.sh') }}

      - name: 编 macOS 版 ffmpeg（LGPL，第一次十几分钟，之后走缓存）
        if: runner.os == 'macOS'
        run: test -x staging/ffmpeg-${{ matrix.target }}/bin/ffmpeg || bash scripts/build-ffmpeg-macos.sh ${{ matrix.target }} 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: 准备随包资源（无头浏览器、ffmpeg、许可）
        run: node scripts/stage-resources.mjs --target ${{ matrix.target }} 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: 打包
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          extra=()
          if [ "$RUNNER_OS" = "Windows" ]; then
            if [ -n "$WIN_CSC_LINK" ]; then export CSC_LINK="$WIN_CSC_LINK" CSC_KEY_PASSWORD="$WIN_CSC_KEY_PASSWORD"; else export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          else
            if [ -n "$MAC_CSC_LINK" ]; then
              export CSC_LINK="$MAC_CSC_LINK" CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"
              [ -n "$APPLE_ID" ] && extra+=("-c.mac.notarize=true")
            else
              export CSC_IDENTITY_AUTO_DISCOVERY=false
              # 没有 Apple 开发者证书：ad-hoc 签名（Apple 芯片上不签名根本跑不起来），关 hardened runtime 免得系统拒绝载入 Electron 框架
              extra+=("-c.mac.identity=-" "-c.mac.hardenedRuntime=false")
            fi
          fi
          npx electron-builder ${{ matrix.builder }} --publish never "${extra[@]}" 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: 列出产物
        run: ls -la release | tee -a "$RUNNER_TEMP/build.log"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/latest*.yml
            release/*.blockmap

      - name: 出错时把日志末尾写成注解
        if: failure()
        run: |
          [ -f "$RUNNER_TEMP/build.log" ] || exit 0
          # 按字节处理（LC_ALL=C）：macOS 的 cut 碰到多字节字符会报错、把后面截掉
          tail -n 80 "$RUNNER_TEMP/build.log" | LC_ALL=C tr -d '\r' | LC_ALL=C cut -b1-300 | LC_ALL=C awk -v t="${{ matrix.target }}" '
            { gsub(/%/, "%25"); buf = buf $0 "%0A"; n++ }
            n == 20 { print "::error title=" t " 日志末尾 " (++k) "::" buf; buf = ""; n = 0 }
            END { if (buf != "") print "::error title=" t " 日志末尾 " (++k) "::" buf }'

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: out
      - name: 建版本草稿（在 Releases 页面检查后再发布）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 两个 mac 架构都叫 latest-mac.yml：前面加上平台架构（放到官网更新目录时去掉前缀，见 README）
          mkdir up
          for d in out/*/; do
            t="$(basename "$d")"
            for f in "$d"*; do
              n="$(basename "$f")"
              case "$n" in latest*.yml) cp "$f" "up/$t-$n" ;; *) cp "$f" up/ ;; esac
            done
          done
          ls -la up
          gh release create "$GITHUB_REF_NAME" up/* --draft --title "唯杰地图动画 $GITHUB_REF_NAME" --notes-file 安装说明.md
